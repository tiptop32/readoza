name: Live site verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run eval:live-site
        env:
          READOZA_EVIDENCE_DIR: ${{ runner.temp }}/readoza-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-site-verification
          path: ${{ runner.temp }}/readoza-live
