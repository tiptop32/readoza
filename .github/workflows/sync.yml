name: Reader sync
on:
  pull_request:
    paths:
      - services/sync/**
      - .github/workflows/sync.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/sync/package-lock.json
      - run: npm ci --prefix services/sync
      - run: npm --prefix services/sync test
      - run: npm --prefix services/sync run eval
      - run: npm --prefix services/sync run build
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/sync/package-lock.json
      - run: npm ci --prefix services/sync
      - run: node services/sync/scripts/prepare-deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          READOZA_D1_DATABASE_ID: ${{ vars.READOZA_D1_DATABASE_ID }}
      - run: npx wrangler d1 migrations apply readoza-sync --remote
        working-directory: services/sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm --prefix services/sync run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
