name: Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run test:proxy
      - run: npm run test:sync
      - run: npm run eval:sync
      - run: npm run eval:proxy
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Build the Pages artifact
        run: npm run build
        env:
          VITE_BASE_PATH: /readoza/
          # PR/CI use a deterministic fixture endpoint. Publication requires the real variable.
          VITE_TG_PROXY: ${{ github.event_name == 'workflow_dispatch' && vars.VITE_TG_PROXY || 'https://proxy.example/tg' }}
          VITE_SYNC_URL: ${{ github.event_name == 'workflow_dispatch' && 'https://readoza-sync.tiptop32-readoza.workers.dev' || 'https://sync.example' }}
      - name: Require the production proxy for publication
        if: github.event_name == 'workflow_dispatch'
        run: node -e 'if (!process.env.VITE_TG_PROXY) throw new Error("Set repository variable VITE_TG_PROXY before publishing")'
        env:
          VITE_TG_PROXY: ${{ vars.VITE_TG_PROXY }}
      - run: npm run eval:dist
        env:
          VITE_SYNC_URL: ${{ github.event_name == 'workflow_dispatch' && 'https://readoza-sync.tiptop32-readoza.workers.dev' || 'https://sync.example' }}
          VITE_TG_PROXY: ${{ github.event_name == 'workflow_dispatch' && vars.VITE_TG_PROXY || 'https://proxy.example/tg' }}
          READOZA_EVIDENCE_DIR: ${{ runner.temp }}/readoza-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-verification
          path: ${{ runner.temp }}/readoza-pages
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with: { path: dist }
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
